name: Build Reader Media Streams

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Media kind to process, or all
        required: true
        default: all
        type: choice
        options: [all, audio, video, swf]
      limit:
        description: Maximum files per shard; 0 means all
        required: true
        default: "0"
        type: string

concurrency:
  group: reader-media
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - name: Plan pending workers
        id: matrix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/plan_reader_stream_matrix.py --kind media --extension "${{ inputs.kind || 'all' }}" --output output/media-matrix.json
          echo "matrix=$(cat output/media-matrix.json)" >> "$GITHUB_OUTPUT"
      - run: tar -czf output/media-plan.tgz output/search_data.json state/commits.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-media-plan
          path: output/media-plan.tgz
          retention-days: 1
  media:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          pip install -r scripts/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/download-artifact@v8
        with:
          name: reader-media-plan
          path: output
      - run: tar -xzf output/media-plan.tgz
      - name: Select requested media kind
        id: select
        env:
          REQUESTED_KIND: all
          MATRIX_KIND: ${{ matrix.extension }}
        run: |
          if [[ "${REQUESTED_KIND}" == "all" || "${REQUESTED_KIND}" == "${MATRIX_KIND}" ]]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build and publish media streams
        if: steps.select.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          [[ "${{ inputs.limit || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          python scripts/pilot_media_stream.py \
            --kind "${{ matrix.extension }}" \
            --limit "${{ inputs.limit || '0' }}" \
            --shard-count 8 \
            --shard-index "${{ matrix.shard }}" \
            --apply
  finalize:
    needs: media
    if: always() && needs.media.result != 'cancelled'
    runs-on: ubuntu-24.04
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Merge canonical media indexes
        env:
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_BUCKET: vomebook/reader-assets-v2
        run: python scripts/finalize_media_indexes.py
