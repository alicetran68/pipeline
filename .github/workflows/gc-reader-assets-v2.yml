name: GC Reader Assets v2

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Delete only objects past the grace period
        required: true
        default: false
        type: boolean
      grace_days:
        description: Days an object must remain orphaned
        required: true
        default: "0"
        type: string
      limit:
        description: Maximum objects deleted in one run; 0 means all
        required: true
        default: "0"
        type: string

concurrency:
  group: reader-gc
  cancel-in-progress: false
  queue: max

jobs:
  gc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Collect v2 Reader assets
        env:
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_BUCKET: vomebook/reader-assets-v2
        run: |
          [[ "${{ inputs.grace_days || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${{ inputs.limit || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          args=(--grace-days "${{ inputs.grace_days || '0' }}" --limit "${{ inputs.limit || '0' }}" --show-paths)
          if [[ "${{ inputs.apply }}" == "true" || "${{ github.event_name }}" == "schedule" ]]; then args+=(--apply); fi
          python scripts/gc_reader_assets_v2.py "${args[@]}"
