name: Schedule PDF OCR

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch OCR worker only when idle
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          runs=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/pdf-ocr-assets.yml/runs?per_page=20")
          active=$(printf '%s' "${runs}" | jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')
          if ((active > 0)); then exit 0; fi
          curl --fail-with-body --silent --show-error -X POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/pdf-ocr-assets.yml/dispatches"
