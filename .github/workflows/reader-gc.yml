name: Reader Cross-Bucket GC

on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:
    inputs:
      record_observations:
        description: Persist complete-graph first-seen orphan observations
        required: true
        default: false
        type: boolean
      grace_days:
        description: First-seen orphan grace period
        required: true
        default: "14"
        type: string
      skip_input_bucket:
        description: Inventory without input credentials (incomplete report)
        default: false
        type: boolean

concurrency:
  group: reader-sidecar
  cancel-in-progress: false
  queue: max

jobs:
  gc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Read-only reference report for all Reader formats
        env:
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_INPUT_NAMESPACE: melsm
          HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
          HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
          SKIP_INPUT_BUCKET: ${{ inputs.skip_input_bucket || 'false' }}
          GRACE_DAYS: ${{ inputs.grace_days || '14' }}
          RECORD_OBSERVATIONS: ${{ inputs.record_observations || 'false' }}
        run: |
          [[ "$GRACE_DAYS" =~ ^[0-9]+$ ]] || exit 1
          args=(--output output/gc/reader-gc-report.json --grace-days "$GRACE_DAYS")
          if [[ "$RECORD_OBSERVATIONS" == "true" ]]; then args+=(--record-observations); fi
          if [[ "$SKIP_INPUT_BUCKET" == "true" ]]; then args+=(--skip-input-bucket); fi
          python scripts/reader_gc_graph.py "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-gc-report
          path: output/gc/reader-gc-report.json
          retention-days: 30
          if-no-files-found: error
