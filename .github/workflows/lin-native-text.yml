name: Backfill Lin Yizhang PDF Text

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: Full Teachers PDF path under a verified Lin Yizhang repair folder
        required: true
        type: string
      dry_run:
        description: Validate text and source without publishing
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    concurrency:
      group: reader-assets
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Validate and optionally publish native text
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_PATH: ${{ inputs.source_path }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          python scripts/publish_lin_native_text.py --path "$SOURCE_PATH" "${args[@]}"
      - name: Publish Reader sidecar to Pages
        if: inputs.dry_run != true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
        run: python scripts/publish_search_reader_index.py
