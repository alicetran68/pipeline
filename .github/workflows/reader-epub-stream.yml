name: Build Reader Ebook Chapter Streams

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum EPUB files; 0 means all
        required: true
        default: "0"
        type: string
      max_source_bytes:
        description: Maximum source bytes per source; 0 means unlimited
        required: true
        default: "0"
        type: string

concurrency:
  group: reader-ebooks
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - run: tar -czf output/ebook-plan.tgz output/search_data.json state/commits.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-ebook-plan
          path: output/ebook-plan.tgz
          retention-days: 1
  epub-stream:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        extension: [epub, mobi, azw3, fb2, chm]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Install Calibre for converted ebook formats
        if: matrix.extension != 'epub'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends calibre
      - name: Install CHM extraction tools
        if: matrix.extension == 'chm'
        run: sudo apt-get install -y --no-install-recommends p7zip-full
      - uses: actions/download-artifact@v8
        with:
          name: reader-ebook-plan
          path: output
      - run: tar -xzf output/ebook-plan.tgz
      - name: Build and publish ebook chapter streams
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          [[ "${{ inputs.limit || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${{ inputs.max_source_bytes || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          python scripts/pilot_epub_chapters.py \
            --extension "${{ matrix.extension }}" \
            --limit "${{ inputs.limit || '0' }}" \
            --max-source-bytes "${{ inputs.max_source_bytes || '0' }}" \
            --shard-count 8 \
            --shard-index "${{ matrix.shard }}" \
            --apply
  finalize:
    needs: epub-stream
    if: always() && needs.epub-stream.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Merge canonical ebook indexes
        env:
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_BUCKET: vomebook/reader-assets-v2
        run: python scripts/finalize_ebook_indexes.py
