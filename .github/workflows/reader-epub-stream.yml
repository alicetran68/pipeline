name: Build Reader Ebook Chapter Streams

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum EPUB files; 0 means all
        required: true
        default: "0"
        type: string
      max_source_bytes:
        description: Maximum source bytes per source; 0 means unlimited
        required: true
        default: "0"
        type: string

concurrency:
  group: reader-assets
  cancel-in-progress: false
  queue: max

jobs:
  epub-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        extension: [epub, mobi, azw3, fb2]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch current source metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - name: Build and publish ebook chapter streams
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          [[ "${{ inputs.limit || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${{ inputs.max_source_bytes || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          python scripts/pilot_epub_chapters.py \
            --extension "${{ matrix.extension }}" \
            --limit "${{ inputs.limit || '0' }}" \
            --max-source-bytes "${{ inputs.max_source_bytes || '0' }}" \
            --shard-count 8 \
            --shard-index "${{ matrix.shard }}" \
            --apply
