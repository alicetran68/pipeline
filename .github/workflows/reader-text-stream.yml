name: Build Reader Text Streams

on:
  workflow_dispatch:
    inputs:
      extension:
        description: Text extension to process, or all
        required: true
        default: all
        type: choice
        options: [all, txt, md, markdown, vcf, ini]
      limit:
        description: Maximum files per extension; 0 means all
        required: true
        default: "0"
        type: string

concurrency:
  group: reader-text
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - run: tar -czf output/text-plan.tgz output/search_data.json state/commits.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-text-plan
          path: output/text-plan.tgz
          retention-days: 1
  text-stream:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        extension: [txt, md, markdown, vcf, ini]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: reader-text-plan
          path: output
      - run: tar -xzf output/text-plan.tgz
      - name: Select requested extension
        id: select
        env:
          REQUESTED_EXTENSION: ${{ inputs.extension || 'all' }}
          MATRIX_EXTENSION: ${{ matrix.extension }}
        run: |
          if [[ "${REQUESTED_EXTENSION}" == "all" || "${REQUESTED_EXTENSION}" == "${MATRIX_EXTENSION}" ]]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish text streams
        if: steps.select.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          [[ "${{ inputs.limit || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          python scripts/pilot_text_stream.py --extension "${{ matrix.extension }}" --limit "${{ inputs.limit || '0' }}" --apply
