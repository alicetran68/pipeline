name: Build Reader Converted Ebook Streams

on:
  workflow_dispatch:
    inputs:
      extension:
        description: Ebook format to convert, or all
        required: true
        default: all
        type: choice
        options: [all, mobi, azw3, fb2]
      limit:
        description: Maximum source files; 0 means all
        required: true
        default: "0"
        type: string
      max_source_bytes:
        description: Maximum source bytes; 0 means unlimited
        required: true
        default: "0"
        type: string

concurrency:
  group: reader-ebooks
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - run: tar -czf output/converted-ebook-plan.tgz output/search_data.json state/commits.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-converted-ebook-plan
          path: output/converted-ebook-plan.tgz
          retention-days: 1
  ebook-stream:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        extension: [mobi, azw3, fb2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ebook tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends calibre
      - run: pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: reader-converted-ebook-plan
          path: output
      - run: tar -xzf output/converted-ebook-plan.tgz
      - name: Select requested extension
        id: select
        env:
          REQUESTED_EXTENSION: ${{ inputs.extension || 'all' }}
          MATRIX_EXTENSION: ${{ matrix.extension }}
        run: |
          if [[ "${REQUESTED_EXTENSION}" == "all" || "${REQUESTED_EXTENSION}" == "${MATRIX_EXTENSION}" ]]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build and publish converted ebook streams
        if: steps.select.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          [[ "${{ inputs.limit || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${{ inputs.max_source_bytes || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          python scripts/pilot_epub_chapters.py --extension "${{ matrix.extension }}" --limit "${{ inputs.limit || '0' }}" --max-source-bytes "${{ inputs.max_source_bytes || '0' }}" --apply
