name: Migrate PDF Page Manifests

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of v1 manifests in this batch"
        required: false
        default: "500"
      checkpoint:
        description: "Zero-based batch number"
        required: false
        default: "0"
      apply:
        description: "Upload v2 manifests after validation"
        required: false
        type: boolean
        default: false

concurrency:
  group: reader-pdf-manifest
  cancel-in-progress: false
  queue: max

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Migrate batch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
        run: |
          args=(--limit "${{ inputs.limit }}" --checkpoint "${{ inputs.checkpoint }}")
          if [[ "${{ inputs.apply }}" == "true" ]]; then args+=(--apply); fi
          python scripts/migrate_pdf_page_manifests.py "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-manifest-migration-${{ inputs.checkpoint }}
          path: output/pdf-manifest-migration/report.json
