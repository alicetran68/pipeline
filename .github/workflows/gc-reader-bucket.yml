name: GC Reader Bucket

on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Delete only staging objects whose consumers completed
        required: true
        default: false
        type: boolean
      limit:
        description: Maximum staging objects deleted in one run; 0 means no limit
        required: true
        default: "0"
        type: string
      grace_days:
        description: Days an object must remain unreferenced before deletion
        required: true
        default: "14"
        type: string
      include_input_bucket:
        description: Scan melsm PNG/JXL objects; enable only after their migration is complete
        required: true
        default: false
        type: boolean
      input_namespace:
        description: Namespace containing the optional OCR input bucket
        required: true
        default: "vomebook"
        type: string
      input_bucket:
        description: Name of the optional OCR input bucket
        required: true
        default: "melsm"
        type: string
      jxl_only:
        description: Restrict candidates and deletion to unreferenced JXL objects
        required: true
        default: false
        type: boolean
      jxl_inventory_only:
        description: Count JXL objects without reading derived manifests or deleting
        required: true
        default: false
        type: boolean
      force_jxl_delete:
        description: DANGER delete every JXL object in vomebook/pdf-pages
        required: true
        default: false
        type: boolean

concurrency:
  group: reader-pdf-gc
  cancel-in-progress: false
  queue: max

jobs:
  gc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Collect completed staging objects
        env:
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
          HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
          HF_S3_NAMESPACE: ${{ vars.HF_S3_NAMESPACE || 'vomebook' }}
          HF_S3_INPUT_NAMESPACE: ${{ inputs.input_namespace || vars.HF_S3_INPUT_NAMESPACE || vars.HF_S3_NAMESPACE || 'vomebook' }}
          HF_S3_INPUT_BUCKET: ${{ inputs.input_bucket || vars.HF_S3_INPUT_BUCKET || 'melsm' }}
          PDF_OCR_INPUT_BUCKET: ${{ inputs.input_bucket || vars.HF_S3_INPUT_BUCKET || 'melsm' }}
        run: |
          [[ "${{ inputs.grace_days || '14' }}" =~ ^[0-9]+$ ]] || exit 1
          args=(--limit "${{ inputs.limit || '0' }}" --grace-days "${{ inputs.grace_days || '14' }}")
          if [[ "${{ inputs.include_input_bucket }}" == "true" ]]; then args+=(--include-input-bucket); fi
          if [[ "${{ inputs.jxl_only }}" == "true" ]]; then args+=(--jxl-only); fi
          if [[ "${{ inputs.jxl_inventory_only }}" == "true" ]]; then args+=(--jxl-inventory-only); fi
          if [[ "${{ inputs.force_jxl_delete }}" == "true" ]]; then args+=(--force-jxl-delete); fi
          if [[ "${{ inputs.apply }}" == "true" ]]; then args+=(--apply); fi
          python scripts/gc_reader_bucket.py "${args[@]}"
