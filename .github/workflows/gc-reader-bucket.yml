name: GC Reader Bucket

on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Delete only staging objects whose consumers completed
        required: true
        default: false
        type: boolean
      limit:
        description: Maximum staging objects deleted in one run; 0 means no limit
        required: true
        default: "0"
        type: string
      grace_days:
        description: Days an object must remain unreferenced before deletion
        required: true
        default: "14"
        type: string
      include_input_bucket:
        description: Scan melsm PNG/JXL objects; enable only after their migration is complete
        required: true
        default: false
        type: boolean

concurrency:
  group: reader-assets
  cancel-in-progress: false
  queue: max

jobs:
  gc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Collect completed staging objects
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          [[ "${{ inputs.grace_days || '14' }}" =~ ^[0-9]+$ ]] || exit 1
          args=(--limit "${{ inputs.limit || '0' }}" --grace-days "${{ inputs.grace_days || '14' }}")
          if [[ "${{ inputs.include_input_bucket }}" == "true" ]]; then args+=(--include-input-bucket); fi
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.apply }}" == "true" ]]; then args+=(--apply); fi
          python scripts/gc_reader_bucket.py "${args[@]}"
