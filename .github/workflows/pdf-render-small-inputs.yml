name: Render Small PDF OCR Inputs

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum pending small PDFs inspected
        default: "100"
        type: string
      generate_jxl:
        description: Also encode optional JXL page images (Reader currently uses WebP)
        default: false
        type: boolean
      retry_failed:
        description: Retry failed rendering for unchanged sources
        default: true
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: pdf-render-small-inputs
  cancel-in-progress: false
  queue: max

env:
  PDF_JXL_ENABLED: ${{ inputs.generate_jxl == true }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      shard_count: ${{ steps.plan.outputs.shard_count }}
      shard_ids: ${{ steps.plan.outputs.shard_ids }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Fetch source metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - name: Plan small PDF rendering
        id: plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LIMIT: ${{ inputs.limit || '100' }}
          RETRY_FAILED: ${{ github.event_name == 'schedule' || inputs.retry_failed }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && ((10#$LIMIT >= 1 && 10#$LIMIT <= 100)) || exit 1
          args=()
          if [[ "$RETRY_FAILED" == true ]]; then args+=(--retry-failed); fi
          python scripts/pdf_ocr_stages.py plan-render --partition small --native-text-stream --limit "$LIMIT" --checkpoint 0 "${args[@]}"
          echo "shard_count=$(jq -r '.shard_count' output/pdf-ocr/queue.json)" >> "$GITHUB_OUTPUT"
          echo "shard_ids=$(jq -c '.shard_ids' output/pdf-ocr/queue.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-render-small-queue
          path: output/pdf-ocr/queue.json
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.shard_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_ids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Install rendering tools
        run: |
          packages=(poppler-utils)
          if [[ "$PDF_JXL_ENABLED" == true ]]; then packages+=(libjxl-tools); fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - uses: actions/download-artifact@v8
        with:
          name: pdf-render-small-queue
          path: output/pdf-ocr
      - name: Render and upload small PDF pages
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/pdf_ocr_stages.py render --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-render-small-results-${{ matrix.shard }}
          path: output/pdf-ocr/bundle/results-*.json
          retention-days: 7
          if-no-files-found: warn

  publish:
    needs: [plan, build]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: reader-assets
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: pdf-render-small-queue
          path: output/pdf-ocr
      - uses: actions/download-artifact@v8
        if: needs.build.result != 'skipped'
        with:
          pattern: pdf-render-small-results-*
          path: output/pdf-ocr/results
      - name: Publish small PDF streams
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/pdf_ocr_stages.py publish-render --results-dir output/pdf-ocr/results
      - name: Publish Reader sidecar to Pages
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
        run: python scripts/publish_search_reader_index.py
