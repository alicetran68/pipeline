name: Prune Reader Assets

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Delete eligible Reader-Assets dataset objects after reporting them
        required: true
        default: false
        type: boolean
      grace_days:
        description: Days an object must remain an orphan before deletion
        required: true
        default: "14"
        type: string
      limit:
        description: Maximum Reader-Assets objects deleted in one run; 0 means no limit
        required: true
        default: "0"
        type: string

concurrency:
  group: reader-prune
  cancel-in-progress: false
  queue: max

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Report and prune orphaned Reader Assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
        run: |
          [[ "${{ inputs.grace_days || '14' }}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${{ inputs.limit || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          args=(--grace-days "${{ inputs.grace_days || '14' }}" --limit "${{ inputs.limit || '0' }}")
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.apply }}" == "true" ]]; then
            args+=(--apply)
          fi
          python scripts/prune_reader_assets.py "${args[@]}"
