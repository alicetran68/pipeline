name: Prune Reader Assets

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Delete eligible objects after reporting them
        required: true
        default: false
        type: boolean
      grace_days:
        description: Days an object must remain orphaned
        required: true
        default: "14"
        type: string
      limit:
        description: Maximum objects deleted in one run
        required: true
        default: "1000"
        type: string
      bucket_apply:
        description: Delete unreferenced PDF Bucket roots (keep false until OCR/JXL migration is stable)
        required: true
        default: false
        type: boolean
      bucket_grace_days:
        description: Days an unreferenced PDF Bucket root must remain before deletion
        required: true
        default: "30"
        type: string

concurrency:
  group: reader-assets
  cancel-in-progress: false
  queue: max

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Report and prune orphaned objects
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          args=(--grace-days "${{ inputs.grace_days || '14' }}" --limit "${{ inputs.limit || '1000' }}")
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.apply }}" == "true" ]]; then args+=(--apply); fi
          python scripts/prune_reader_assets.py "${args[@]}"
      - name: Report and optionally prune unreferenced PDF Bucket roots
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          args=(--grace-days "${{ inputs.bucket_grace_days || '30' }}" --limit "${{ inputs.limit || '1000' }}")
          if { [[ "${{ github.event_name }}" == "schedule" ]] && [[ "${{ vars.PDF_BUCKET_GC_APPLY }}" == "true" ]]; } || \
             { [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ "${{ inputs.bucket_apply }}" == "true" ]]; }; then
            args+=(--apply --allow-unreferenced)
          fi
          python scripts/prune_pdf_bucket.py "${args[@]}"
