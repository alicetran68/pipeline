name: Build PDF Assets Worker

on:
  workflow_dispatch:

concurrency:
  group: reader-pdf
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      shard_count: ${{ steps.shards.outputs.shard_count }}
      shard_ids: ${{ steps.shards.outputs.shard_ids }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Fetch current source metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - name: Plan page-weighted PDF queue
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
          PDF_PUBLISH_BATCH_SIZE: "50"
          PDF_PUBLISH_BATCH_DELAY: "5"
        run: |
          limit=50
          checkpoint=0
          python scripts/plan_pdf_assets.py \
            --repo "" \
            --source "all" \
            --limit "${limit}" \
             --checkpoint "${checkpoint}" \
             --shard-count 18 \
             --workers 8 \
             --output output/pdf-assets/queue.json
      - name: Export dynamic shard matrix
        id: shards
        run: |
          echo "shard_count=$(jq -r '.shard_count' output/pdf-assets/queue.json)" >> "$GITHUB_OUTPUT"
          echo "shard_ids=$(jq -c '.shard_ids' output/pdf-assets/queue.json)" >> "$GITHUB_OUTPUT"
          jq -c '.skipped // []' output/pdf-assets/queue.json > output/pdf-assets/skipped.json
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-assets-queue
          path: output/pdf-assets/queue.json
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-assets-skipped
          path: output/pdf-assets/skipped.json
  build:
    needs: plan
    if: ${{ needs.plan.outputs.shard_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_ids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils webp
      - uses: actions/download-artifact@v8
        with:
          name: pdf-assets-queue
          path: output/pdf-assets
      - name: Build PDF asset bundle
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
          FORCE_SYNC: "true"
        run: |
          args=(--source "all" --shard-count "${{ needs.plan.outputs.shard_count }}" --shard-index "${{ matrix.shard }}" --extension pdf --queue-file output/pdf-assets/queue.json --build-only)
          python scripts/pdf_assets.py "${args[@]}" --bundle "output/pdf-assets/bundle"
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-assets-bundle-${{ matrix.shard }}
          path: output/pdf-assets/bundle
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Download all PDF asset bundles
        uses: actions/download-artifact@v8
        with:
          pattern: pdf-assets-bundle-*
          path: output/pdf-assets/bundles
          merge-multiple: false
      - name: Download skipped entries
        uses: actions/download-artifact@v8
        with:
          name: pdf-assets-skipped
          path: output/pdf-assets
      - name: Publish merged PDF assets atomically
        if: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
        run: python scripts/publish_pdf_assets.py --bundles output/pdf-assets/bundles/* --skipped output/pdf-assets/skipped.json
  sync-pages:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Sync Reader Assets sidecar to GitHub Pages
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
        run: python scripts/publish_search_reader_index.py
