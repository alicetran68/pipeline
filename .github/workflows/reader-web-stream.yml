name: Build Reader Web Streams

on:
  workflow_dispatch:
    inputs:
      extension:
        description: Web format to process, or all
        required: true
        default: all
        type: choice
        options: [all, html, htm, mht, mhtml]
      limit:
        description: Maximum files; 0 means all
        required: true
        default: "0"
        type: string

concurrency:
  group: reader-web
  cancel-in-progress: false
  queue: max

jobs:
  web-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        extension: [html, htm, mht, mhtml]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch current source metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - name: Select requested extension
        id: select
        env:
          REQUESTED_EXTENSION: ${{ inputs.extension || 'all' }}
          MATRIX_EXTENSION: ${{ matrix.extension }}
        run: |
          if [[ "${REQUESTED_EXTENSION}" == "all" || "${REQUESTED_EXTENSION}" == "${MATRIX_EXTENSION}" ]]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build and publish web streams
        if: steps.select.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          [[ "${{ inputs.limit || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          python scripts/pilot_web_stream.py --extension "${{ matrix.extension }}" --limit "${{ inputs.limit || '0' }}" --apply
