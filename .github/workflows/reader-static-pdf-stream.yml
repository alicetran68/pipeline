name: Build Reader Static PDF Streams

on:
  workflow_dispatch:
    inputs:
      extension:
        description: Static PDF format to process, or all
        required: true
        default: all
        type: choice
        options: [all, ppt, pptx, pps, wps, ps]
      limit:
        description: Maximum sources; 0 means all
        required: true
        default: "0"
        type: string
      retry_failures:
        description: Retry previously recorded failures
        required: true
        default: false
        type: boolean

concurrency:
  group: reader-static-pdf
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - name: Plan pending static PDF workers
        id: matrix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          args=(--kind static-pdf --extension "${{ inputs.extension || 'all' }}" --output output/static-pdf-matrix.json)
          if [[ "${{ inputs.retry_failures }}" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/plan_reader_stream_matrix.py "${args[@]}"
          echo "matrix=$(cat output/static-pdf-matrix.json)" >> "$GITHUB_OUTPUT"
      - run: tar -czf output/static-pdf-plan.tgz output/search_data.json state/commits.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-static-pdf-plan
          path: output/static-pdf-plan.tgz
          retention-days: 1
  stream:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Install PDF conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice ghostscript poppler-utils fontconfig fonts-noto-cjk fonts-wqy-microhei
      - uses: actions/download-artifact@v8
        with:
          name: reader-static-pdf-plan
          path: output
      - run: tar -xzf output/static-pdf-plan.tgz
      - name: Convert and publish static PDF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          [[ "${{ inputs.limit || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          args=(--extension "${{ matrix.extension }}" --limit "${{ inputs.limit || '0' }}" --apply)
          if [[ "${{ inputs.retry_failures }}" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/pilot_static_pdf_stream.py "${args[@]}"
