name: Schedule Large PDF Render

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch large PDF renderer only when idle
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          runs=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/pdf-render-inputs.yml/runs?per_page=20")
          active=$(printf '%s' "${runs}" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if ((active > 0)); then
            echo "Large PDF renderer already active or queued; no pending run will be created."
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/pdf-render-inputs.yml/dispatches"
