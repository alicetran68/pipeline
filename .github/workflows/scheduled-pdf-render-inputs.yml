name: Schedule Large PDF Rendering

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Render PDF OCR Inputs"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: pdf-render-inputs-controller
  cancel-in-progress: false
  queue: max

jobs:
  dispatch:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.display_title == 'Serial large PDF render' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'startup_failure'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Dispatch only when no render run is pending or active
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          RETRY_FAILED: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
          QUEUE_LANE: ${{ vars.PDF_RENDER_QUEUE_LANE || '0' }}
        run: python3 -B scripts/dispatch_pdf_render.py --lane-index "$QUEUE_LANE"
