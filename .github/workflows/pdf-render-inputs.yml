name: Render PDF OCR Inputs

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum pending large PDFs inspected (the controller uses one)
        default: "1"
        type: string
      checkpoint:
        description: Checkpoint in the pending PDF queue
        default: "0"
        type: string
      generate_jxl:
        description: Also encode optional JXL page images (Reader currently uses WebP)
        default: false
        type: boolean
      retry_failed:
        description: Retry failed rendering for unchanged sources
        default: true
        type: boolean
      recover_run:
        description: Publish existing render artifacts from this main-branch render run (no rendering)
        default: ""
        type: string
      recover_progress_only:
        description: Checkpoint verified ranges from recover_run without assembling whole books
        default: false
        type: boolean
      source_repo:
        description: Exact source dataset filter, or blank for all
        default: ""
        type: string
      source_path_prefix:
        description: Source path prefix filter, or blank for all
        default: ""
        type: string
      render_lane:
        description: Independent lane for a single manually scoped source (blank keeps the shared queue)
        default: ""
        type: string
      force_reprobe:
        description: Re-probe and rebuild the selected source paths
        default: false
        type: boolean
      continue_queue:
        description: After a successful book publish, wake the controller for the next book
        default: false
        type: boolean
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.render_lane && format('pdf-render-inputs-{0}', inputs.render_lane) || 'pdf-render-inputs' }}
  cancel-in-progress: false
  queue: max

env:
  PDF_JXL_ENABLED: ${{ inputs.generate_jxl == true }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      shard_count: ${{ steps.plan.outputs.shard_count }}
      shard_ids: ${{ steps.plan.outputs.shard_ids }}
      book_count: ${{ steps.plan.outputs.book_count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk
      - name: Fetch source metadata
        if: inputs.recover_run == ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - name: Plan PNG rendering without a PDF size threshold
        if: inputs.recover_run == ''
        id: plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LIMIT: ${{ inputs.limit || '100' }}
          CHECKPOINT: ${{ inputs.checkpoint || '0' }}
          RETRY_FAILED: ${{ github.event_name == 'schedule' || inputs.retry_failed }}
          SOURCE_REPO: ${{ inputs.source_repo || '' }}
          SOURCE_PATH_PREFIX: ${{ inputs.source_path_prefix || '' }}
          RENDER_LANE: ${{ inputs.render_lane || '' }}
          FORCE_REPROBE: ${{ inputs.force_reprobe || 'false' }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && ((10#$LIMIT >= 1 && 10#$LIMIT <= 100)) || exit 1
          [[ "$CHECKPOINT" =~ ^[0-9]+$ ]] || exit 1
          if [[ -n "$RENDER_LANE" ]]; then
            [[ "$RENDER_LANE" =~ ^[a-z0-9-]{1,32}$ ]] && [[ -n "$SOURCE_REPO" && -n "$SOURCE_PATH_PREFIX" ]] || exit 1
          fi
          args=()
          if [[ "$RETRY_FAILED" == true ]]; then args+=(--retry-failed); fi
          if [[ "$FORCE_REPROBE" == true ]]; then args+=(--force-reprobe); fi
          python scripts/pdf_ocr_stages.py plan-render --partition large --native-text-stream --target-render-seconds 1500 --source-repo "$SOURCE_REPO" --source-path-prefix "$SOURCE_PATH_PREFIX" --limit "$LIMIT" --checkpoint "$CHECKPOINT" "${args[@]}"
          echo "shard_count=$(jq -r '.shard_count' output/pdf-ocr/queue.json)" >> "$GITHUB_OUTPUT"
          echo "shard_ids=$(jq -c '.shard_ids' output/pdf-ocr/queue.json)" >> "$GITHUB_OUTPUT"
          echo "book_count=$(jq -r '.books | length' output/pdf-ocr/queue.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: inputs.recover_run == ''
        with:
          name: pdf-render-queue
          path: output/pdf-ocr/queue.json
          retention-days: 7
  build:
    needs: plan
    if: inputs.recover_run == '' && needs.plan.outputs.shard_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_ids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Install rendering tools
        run: |
          packages=(poppler-utils)
          if [[ "$PDF_JXL_ENABLED" == true ]]; then packages+=(libjxl-tools); fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - uses: actions/download-artifact@v8
        with:
          name: pdf-render-queue
          path: output/pdf-ocr
      - name: Render and upload PNG WebP and optional JXL
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/pdf_ocr_stages.py render --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-render-results-${{ matrix.shard }}
          path: output/pdf-ocr/bundle/results-*.json
          retention-days: 7
          if-no-files-found: warn
  publish:
    needs: [plan, build]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: reader-assets
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Validate recovery run identity
        if: inputs.recover_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER_RUN: ${{ inputs.recover_run }}
        run: |
          [[ "$RECOVER_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/${{ github.repository }}/actions/runs/$RECOVER_RUN" > "$RUNNER_TEMP/recover-run.json"
          jq -e '.head_branch == "main" and .path == ".github/workflows/pdf-render-inputs.yml" and .status == "completed"' "$RUNNER_TEMP/recover-run.json"
      - uses: actions/download-artifact@v8
        with:
          name: pdf-render-queue
          path: output/pdf-ocr
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recover_run || github.run_id }}
      - name: Download render results at a controlled rate
        if: needs.build.result != 'skipped' || inputs.recover_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_RUN: ${{ inputs.recover_run || github.run_id }}
        run: python scripts/download_pdf_render_results.py --repo "${{ github.repository }}" --run-id "$RENDER_RUN" --output output/pdf-ocr/results
      - name: Publish complete image inputs and Reader streams
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROGRESS_ONLY: ${{ inputs.recover_progress_only || 'false' }}
          RECOVER_RUN: ${{ inputs.recover_run || '' }}
        run: |
          args=()
          if [[ "$PROGRESS_ONLY" == true ]]; then
            test -n "$RECOVER_RUN"
            args+=(--recover-progress-only)
          fi
          python scripts/pdf_ocr_stages.py publish-render --results-dir output/pdf-ocr/results "${args[@]}"
      - name: Publish Reader sidecar to Pages
        if: inputs.recover_progress_only != true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
        run: python scripts/publish_search_reader_index.py

  notify-controller:
    needs: [plan, publish]
    if: inputs.continue_queue == true && inputs.recover_run == '' && needs.plan.result == 'success' && needs.plan.outputs.book_count != '0' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Wake the serial large-render controller
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${GH_PAT}"
          curl --fail-with-body --silent --show-error -X POST \
            --header "Authorization: Bearer ${GH_PAT}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/scheduled-pdf-render-inputs.yml/dispatches"
