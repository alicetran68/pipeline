name: Build Reader Assets

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Exact source dataset, or blank for all
        required: false
        default: ""
        type: string
      extension:
        description: txt, md, markdown, jpg, jpeg, png, gif, bmp, webp, doc, docx, epub, htm, html, mobi, azw3, fb2, odt, rtf, chm, tif, tiff, djvu, ppt, pptx, pps, odp, xls, xlsx, csv, ods, wps, mht, mhtml, ps, caj, kdh, or blank
        required: false
        default: ""
        type: string
      path:
        description: Exact source path within the dataset, or blank for all
        required: false
        default: ""
        type: string
      limit:
        description: Files per shard conversion batch
        required: true
        default: "20"
        type: string
      checkpoint_batches:
        description: Maximum checkpoints in this run
        required: true
        default: "30"
        type: string
      retry_failed:
        description: Retry current-profile failures
        required: false
        default: false
        type: boolean
      force:
        description: Rebuild even when the current asset is ready
        required: false
        default: false
        type: boolean
      bucket_migrate:
        description: Publish final static Reader artifacts to the existing pdf-pages bucket (PDF/OCR and ebook chapter flows stay on their dedicated pipelines)
        required: false
        default: true
        type: boolean
      bucket_pdf_staging:
        description: Explicitly stage PDF-producing formats in pdf-optimized for the paused PDF Range evaluation; enable only when that pipeline is active
        required: false
        default: false
        type: boolean
      dry_run:
        description: Scan only; do not download, convert, or publish
        required: false
        default: false
        type: boolean
      command_timeout:
        description: Per-command timeout in seconds
        required: false
        default: "120"
        type: string

concurrency:
  group: reader-assets
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      extension: ${{ steps.scan.outputs.extension }}
      count: ${{ steps.scan.outputs.count }}
      stale_count: ${{ steps.scan.outputs.stale_count }}
      authoritative: ${{ steps.scan.outputs.authoritative }}
      shards: ${{ steps.scan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch current source metadata
        run: |
          for attempt in 1 2 3 4 5; do
            if python scripts/fetch_and_parse.py; then exit 0; fi
            ((attempt == 5)) && exit 1
            delay=$((30 * 2 ** (attempt - 1)))
            echo "Source metadata request failed; retrying in ${delay}s (attempt $((attempt + 1))/5)" >&2
            sleep "${delay}"
          done
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
      - name: Scan incremental Reader Assets queue
        id: scan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_NAMESPACE: vomebook
          READER_ASSETS_REPO: vomebook/Reader-Assets
          PER_SHARD_LIMIT: ${{ inputs.limit || '20' }}
          CHECKPOINT_BATCHES: ${{ inputs.checkpoint_batches || '30' }}
          COMMAND_TIMEOUT: ${{ inputs.command_timeout || '120' }}
          FORCE_REBUILD: ${{ inputs.force || 'false' }}
          INPUT_REPO: ${{ inputs.repo || '' }}
          INPUT_EXTENSION: ${{ inputs.extension || '' }}
          INPUT_PATH: ${{ inputs.path || '' }}
        run: |
          retry_reader_command() {
            local attempt delay
            for attempt in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              ((attempt == 5)) && return 1
              delay=$((30 * 2 ** (attempt - 1)))
              echo "Reader metadata request failed; retrying in ${delay}s (attempt $((attempt + 1))/5)" >&2
              sleep "${delay}"
            done
          }
          [[ "${PER_SHARD_LIMIT}" =~ ^[0-9]+$ ]] && ((10#${PER_SHARD_LIMIT} >= 1 && 10#${PER_SHARD_LIMIT} <= 100)) || { echo "limit must be between 1 and 100" >&2; exit 1; }
          [[ "${CHECKPOINT_BATCHES}" =~ ^[0-9]+$ ]] && ((10#${CHECKPOINT_BATCHES} >= 1 && 10#${CHECKPOINT_BATCHES} <= 100)) || { echo "checkpoint_batches must be between 1 and 100" >&2; exit 1; }
          [[ "${COMMAND_TIMEOUT}" =~ ^[0-9]+$ ]] && ((10#${COMMAND_TIMEOUT} >= 30 && 10#${COMMAND_TIMEOUT} <= 7200)) || { echo "command_timeout must be between 30 and 7200" >&2; exit 1; }
          total_limit=$((20 * 10#${PER_SHARD_LIMIT} * 10#${CHECKPOINT_BATCHES}))
          args=(
            --repo "${INPUT_REPO}"
            --extension "${INPUT_EXTENSION}"
            --path "${INPUT_PATH}"
            --limit "${total_limit}"
          )
          if [[ "${{ inputs.retry_failed }}" == "true" ]]; then args+=(--retry-failed); fi
          if [[ "${{ inputs.force }}" == "true" ]]; then args+=(--force); fi
          if [[ "${{ inputs.bucket_migrate }}" == "true" ]]; then args+=(--bucket-migrate); fi
          if [[ "${{ inputs.bucket_pdf_staging }}" == "true" ]]; then args+=(--bucket-pdf-staging); fi
          retry_reader_command python scripts/scan_reader_assets.py "${args[@]}"
          python scripts/prepare_reader_assets_plan.py
      - name: Package conversion plan
        if: inputs.dry_run != true
        run: tar -czf output/reader-assets/plan.tgz output/search_data.json state/commits.json output/reader-assets/snapshot.json output/reader-assets/queue-*.json
      - uses: actions/upload-artifact@v7
        if: inputs.dry_run != true
        with:
          name: reader-assets-plan
          path: output/reader-assets/plan.tgz
          retention-days: 1
          if-no-files-found: error
      - name: Report dry-run queue
        if: inputs.dry_run == true
        run: python -m json.tool output/reader-assets/queue.json

  convert:
    needs: plan
    if: inputs.dry_run != true && needs.plan.outputs.extension != '' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: reader-assets-plan
          path: output/reader-assets/plan
      - name: Restore conversion plan
        run: tar -xzf output/reader-assets/plan/plan.tgz
      - name: Install conversion tools
        env:
          EXTENSION: ${{ needs.plan.outputs.extension }}
          INPUT_EXTENSION: ${{ inputs.extension || '' }}
        run: |
          packages=()
          case "${EXTENSION}" in
            static)
              if [[ "${INPUT_EXTENSION}" == "xls" || "${INPUT_EXTENSION}" == "xlsx" ]]; then
                packages=(libreoffice-calc fontconfig fonts-noto-cjk fonts-wqy-microhei)
              else
                packages=(calibre libreoffice qpdf ghostscript poppler-utils p7zip-full fontconfig fonts-noto-cjk fonts-wqy-microhei)
              fi
              ;;
            pdf) packages=(qpdf poppler-utils) ;;
            doc|docx|ppt|pptx|pps|odp|xls|xlsx|csv|ods|wps) packages=(libreoffice qpdf fontconfig fonts-noto-cjk fonts-wqy-microhei ghostscript poppler-utils tesseract-ocr tesseract-ocr-chi-sim) ;;
            htm|html) packages=() ;;
            epub) packages=(calibre qpdf) ;;
            mobi|azw3|fb2) packages=(calibre) ;;
            odt) packages=(libreoffice) ;;
            rtf) packages=(calibre libreoffice fontconfig fonts-noto-cjk fonts-wqy-microhei) ;;
            chm) packages=(calibre p7zip-full) ;;
            djvu) packages=(djvulibre-bin qpdf poppler-utils) ;;
            tif|tiff) packages=(poppler-utils) ;;
            mht|mhtml) packages=() ;;
            ps) packages=(ghostscript poppler-utils) ;;
            caj|kdh) packages=(git mupdf-tools poppler-utils libjbig2dec0-dev) ;;
            ape|wma|amr|flv|f4v|rm|rmvb|mkv|avi|mpg|mpeg|mts|ts|wmv) packages=(ffmpeg) ;;
            *) echo "Unsupported queued extension: ${EXTENSION}" >&2; exit 1 ;;
          esac
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          if [[ "${INPUT_EXTENSION}" == "xls" || "${INPUT_EXTENSION}" == "xlsx" ]]; then
            pip install -r scripts/requirements-spreadsheet-render.txt
            if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
              python -m playwright install --with-deps chromium
            fi
          fi
          if [[ "${EXTENSION}" == "caj" || "${EXTENSION}" == "kdh" ]]; then
            sudo git clone --filter=blob:none --no-checkout https://github.com/caj2pdf/caj2pdf.git /opt/caj2pdf
            sudo git -C /opt/caj2pdf checkout --detach 6c4bc32b15ce748d211f45d536f5d5511ef9f368
            pip install imagesize==1.3.0 PyPDF2==2.2.0
            cc -Wall -fPIC --shared -o /opt/caj2pdf/libjbigdec.so /opt/caj2pdf/lib/jbigdec.cc /opt/caj2pdf/lib/JBigDecode.cc
            cc -Wall $(pkg-config --cflags jbig2dec) -fPIC --shared -o /opt/caj2pdf/libjbig2codec.so /opt/caj2pdf/lib/decode_jbig2data_x.cc $(pkg-config --libs jbig2dec)
          fi
          if [[ "${EXTENSION}" == "doc" || "${EXTENSION}" == "docx" ]]; then
            fc-cache -f
            fc-match -f '%{family}\n' 'SimSun:lang=zh-cn' | grep -E 'Noto|WenQuanYi'
          fi
      - name: Convert assigned queue
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_NAMESPACE: vomebook
          READER_ASSETS_REPO: vomebook/Reader-Assets
          READER_CONVERSION_COMMAND_TIMEOUT: ${{ inputs.command_timeout || '120' }}
          READER_EPUB_COMMAND_TIMEOUT: ${{ inputs.command_timeout || '120' }}
          READER_CHM_COMMAND_TIMEOUT: ${{ inputs.command_timeout || '120' }}
          READER_DJVU_COMMAND_TIMEOUT: ${{ inputs.command_timeout || '120' }}
          READER_CONVERSION_WORKERS: ${{ needs.plan.outputs.extension == 'djvu' && '2' || '1' }}
          EXTENSION: ${{ needs.plan.outputs.extension }}
          BATCH_SIZE: ${{ inputs.limit || '20' }}
          CHECKPOINT_BATCHES: ${{ inputs.checkpoint_batches || '30' }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.force == true && inputs.bucket_migrate != true && '1' || '20' }}
          SOURCE_REPO: ${{ inputs.repo || '' }}
          SOURCE_PATH: ${{ inputs.path || '' }}
          INPUT_EXTENSION: ${{ inputs.extension || '' }}
          RETRY_FAILED: ${{ inputs.retry_failed || 'false' }}
          FORCE_REBUILD: ${{ inputs.force || 'false' }}
          CAJ2PDF_DIR: /opt/caj2pdf
          READER_CONVERSION_PASSWORD: ${{ secrets.READER_CONVERSION_PASSWORD }}
        run: |
          queue="output/reader-assets/queue-${SHARD_INDEX}.json"
          count=$(python -c 'import json, sys; print(len(json.load(open(sys.argv[1]))["items"]))' "${queue}")
          if [[ "${count}" == "0" ]]; then
            exit 0
          fi
          echo "Shard ${SHARD_INDEX}: ${count} ${EXTENSION} asset(s)"
          bundle="output/reader-assets/bundle-${SHARD_INDEX}-1"
          conversion_status=0
          # The plan already contains the complete shard queue. Re-scanning the
          # remote manifest here makes every shard race on the same HF request.
          python scripts/convert_reader_assets.py --queue "${queue}" --bundle "${bundle}" || conversion_status=$?
          if ((conversion_status != 0)); then
            echo "All conversions in this batch failed; failure state was bundled" >&2
            exit "${conversion_status}"
          fi

      - name: Package conversion bundles
        if: always()
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          shopt -s nullglob
          bundles=(output/reader-assets/bundle-${SHARD_INDEX}-*)
          if ((${#bundles[@]} == 0)); then
            marker="output/reader-assets/.empty-${SHARD_INDEX}"
            : > "${marker}"
            archive="${RUNNER_TEMP}/shard-${SHARD_INDEX}.tgz"
            tar -czf "${archive}" -C "$(dirname "${marker}")" "$(basename "${marker}")"
            test -s "${archive}"
            stat "${archive}"
            exit 0
          fi
          names=()
          for bundle in "${bundles[@]}"; do names+=("${bundle##*/}"); done
          archive="${RUNNER_TEMP}/shard-${SHARD_INDEX}.tgz"
          tar -czf "${archive}" \
            -C "${GITHUB_WORKSPACE}/output/reader-assets" "${names[@]}"
          test -s "${archive}"
          stat "${archive}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-assets-bundles-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.tgz
          retention-days: 1
          if-no-files-found: ignore

  publish:
    needs: [plan, convert]
    if: >-
      always() && inputs.dry_run != true && needs.plan.result == 'success' &&
      (needs.convert.result == 'success' || needs.convert.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Download shard ${{ matrix.shard }}
        uses: actions/download-artifact@v8
        with:
          name: reader-assets-bundles-${{ matrix.shard }}
          path: output/reader-assets/bundles
      - name: Publish shard ${{ matrix.shard }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_NAMESPACE: vomebook
          READER_ASSETS_REPO: vomebook/Reader-Assets
        run: |
          shopt -s nullglob
          destinations=()
          for archive in output/reader-assets/bundles/*.tgz output/reader-assets/bundles/*/*.tgz; do
            [[ -f "${archive}" ]] || continue
            destination="${RUNNER_TEMP}/published-$(basename "${archive%.tgz}")"
            mkdir -p "${destination}"
            tar -xzf "${archive}" -C "${destination}"
            destinations+=("${destination}")
            rm -f "${archive}"
          done
          bundles=()
          for destination in "${destinations[@]}"; do
            for bundle in "${destination}"/bundle-*; do
              [[ -d "${bundle}" ]] || continue
              bundles+=("${bundle}")
            done
          done
          if ((${#bundles[@]})); then
            python scripts/publish_reader_assets.py --bundles "${bundles[@]}"
          fi
          rm -rf "${destinations[@]}"

  finalize:
    needs: [plan, convert, publish]
    if: >-
      always() && inputs.dry_run != true && needs.plan.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: reader-assets-plan
          path: output/reader-assets/plan
      - name: Restore conversion plan
        run: tar -xzf output/reader-assets/plan/plan.tgz
      - name: Remove stale Reader mappings
        if: (needs.convert.result == 'success' || needs.convert.result == 'skipped') && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && needs.plan.outputs.authoritative == 'true' && needs.plan.outputs.stale_count != '0'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_NAMESPACE: vomebook
          READER_ASSETS_REPO: vomebook/Reader-Assets
        run: |
          python scripts/convert_reader_assets.py --queue output/reader-assets/snapshot.json --bundle output/reader-assets/finalize
          python scripts/publish_reader_assets.py --bundle output/reader-assets/finalize
      - name: Publish sidecar to GitHub Pages
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
        run: python scripts/publish_search_reader_index.py
